<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ponchielli Home</title>
  <meta name="description" content="Ponchielli Home a Milano: pagina elegante bilingue con galleria, contatti e indicazioni per arrivare." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Parisienne&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef4ef;
      --bg-2: #e5eee7;
      --paper: rgba(255,255,255,0.72);
      --paper-strong: #fbfdf9;
      --ink: #2c342f;
      --muted: #62706a;
      --line: rgba(44,52,47,0.12);
      --sage-1: #dfeae0;
      --sage-4: #6f8b79;
      --shadow: 0 18px 48px rgba(39, 51, 43, 0.10), 0 4px 14px rgba(39, 51, 43, 0.06);
      --radius-xl: 30px;
      --max: 1240px;
      --font-body: 'Inter', sans-serif;
      --font-display: 'Cormorant Garamond', serif;
      --font-script: 'Parisienne', cursive;
    }
    [data-theme="dark"] {
      --bg: #18201b;
      --bg-2: #1d2620;
      --paper: rgba(31,39,34,0.80);
      --paper-strong: #222c26;
      --ink: #edf2ed;
      --muted: #b6c1b8;
      --line: rgba(255,255,255,0.11);
      --sage-1: #26322b;
      --sage-4: #9eb5a3;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(205,220,207,0.75), transparent 28%),
        radial-gradient(circle at 85% 0%, rgba(183,154,99,0.10), transparent 24%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      line-height: 1.65;
    }
    a { color: inherit; }
    img { display:block; width:100%; height:auto; }
    .container { width:min(calc(100% - 28px), var(--max)); margin:0 auto; }
    header { position:sticky; top:0; z-index:30; backdrop-filter: blur(18px); background: color-mix(in srgb, var(--bg) 80%, transparent); border-bottom:1px solid var(--line); }
    .nav { min-height:80px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand { display:flex; align-items:center; gap:14px; text-decoration:none; }
    .mark { width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(145deg, var(--paper-strong), var(--sage-1)); border:1px solid var(--line); box-shadow:var(--shadow); color:var(--sage-4); }
    .brand-copy strong { display:block; font-family:var(--font-display); font-size:1.25rem; font-weight:600; }
    .brand-copy span { display:block; color:var(--muted); font-size:0.92rem; }
    .nav-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .btn, .toggle { min-height:44px; padding:11px 16px; border-radius:999px; border:1px solid var(--line); background:var(--paper-strong); color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; font:inherit; }
    .btn-primary { background:linear-gradient(135deg, #6f8b79, #7b9784); color:white; border-color:transparent; box-shadow:var(--shadow); }
    main { padding:24px 0 72px; }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-xl); box-shadow:var(--shadow); backdrop-filter: blur(12px); }
    .hero { display:grid; grid-template-columns:1.04fr .96fr; gap:24px; align-items:stretch; margin-top:14px; }
    .hero-copy { padding:clamp(28px,4.8vw,58px); position:relative; overflow:hidden; }
    .eyebrow { display:inline-flex; padding:8px 12px; border-radius:999px; background:var(--sage-1); color:var(--sage-4); font-size:0.92rem; margin-bottom:14px; }
    .script-name { font-family:var(--font-script); font-size:clamp(2.6rem,4vw,4.6rem); color:var(--sage-4); line-height:1; margin:0 0 -4px; }
    h1 { margin:0 0 16px; font-family:var(--font-display); font-size:clamp(2.8rem,5vw,5.6rem); line-height:0.95; font-weight:600; }
    .lead { margin:0 0 24px; color:var(--muted); font-size:clamp(1.03rem,1.7vw,1.18rem); max-width:58ch; }
    .meta-row { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:24px; }
    .meta { padding:10px 13px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,0.55); font-size:0.94rem; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; }
    .hero-image { min-height:590px; overflow:hidden; position:relative; }
    .hero-image img { width:100%; height:100%; object-fit:cover; }
    .floating-note { position:absolute; left:18px; bottom:18px; max-width:300px; padding:14px 16px; border-radius:22px; background:rgba(251,253,249,0.84); border:1px solid var(--line); box-shadow:var(--shadow); font-family:var(--font-display); font-size:1.1rem; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    .box { padding:30px; }
    section { margin-top:24px; }
    h2 { margin:0 0 12px; font-family:var(--font-display); font-size:clamp(1.8rem,2.5vw,2.6rem); line-height:1.02; font-weight:600; }
    .muted { color:var(--muted); }
    .amenities { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; margin-top:18px; }
    .amenity { padding:16px; border-radius:20px; border:1px solid var(--line); background:linear-gradient(180deg, rgba(255,255,255,0.72), rgba(223,234,224,0.58)); }
    .amenity strong { display:block; color:var(--sage-4); margin-bottom:5px; font-size:0.96rem; }
    .gallery-header { display:flex; justify-content:space-between; gap:16px; align-items:end; margin-bottom:14px; }
    .gallery-grid { display:grid; grid-template-columns:repeat(12,1fr); gap:16px; }
    .gallery-card { position:relative; overflow:hidden; border-radius:26px; border:1px solid var(--line); background:var(--paper-strong); box-shadow:var(--shadow); }
    .gallery-card img { width:100%; height:100%; object-fit:cover; }
    .wide { grid-column:span 7; min-height:450px; }
    .tall { grid-column:span 5; min-height:450px; }
    .half { grid-column:span 6; min-height:320px; }
    .caption { position:absolute; left:18px; bottom:16px; z-index:1; color:white; font-family:var(--font-display); font-size:1.1rem; text-shadow:0 2px 10px rgba(0,0,0,0.24); }
    .contact-grid { display:grid; grid-template-columns:1fr .95fr; gap:24px; }
    .contact-list, .route-list { display:grid; gap:14px; margin-top:18px; }
    .contact-item, .route-card { padding:16px; border-radius:20px; border:1px solid var(--line); background:rgba(255,255,255,0.58); }
    .contact-item strong, .route-card strong { display:block; color:var(--sage-4); margin-bottom:4px; }
    .route-card h3 { margin:0 0 8px; font-family:var(--font-display); font-size:1.45rem; font-weight:600; }
    .route-card p { margin:8px 0 0; color:var(--muted); }
    .route-card ul { margin:10px 0 0; padding-left:18px; color:var(--muted); }
    @media (max-width: 1020px) { .hero, .grid-2, .contact-grid { grid-template-columns:1fr; } .hero-image { min-height:380px; } .wide, .tall, .half { grid-column:span 12; min-height:280px; } .amenities { grid-template-columns:1fr; } }
    @media (max-width: 640px) { .nav { padding:12px 0; align-items:flex-start; flex-direction:column; } .box, .hero-copy { padding:22px; } .container { width:min(calc(100% - 20px), var(--max)); } .script-name { font-size:2.5rem; } h1 { font-size:3rem; } }
  </style>
</head>
